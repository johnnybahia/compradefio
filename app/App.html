        'Itens já confirmados (por aqui ou pelo PDF) — já saíram da lista de pendentes acima; ' +
        'aqui é só pra consulta, mais recente primeiro.'
      ) +
      (editavel
        ? '<div class="linha-form" style="align-items:flex-end">' +
            '<div class="campo" style="max-width:170px"><label for="cancel-emb-num">Cancelar embarque nº</label>' +
              '<input type="text" id="cancel-emb-num" placeholder="ex.: 5"></div>' +
            '<label style="font-weight:400;white-space:nowrap">' +
              '<input type="checkbox" id="cancel-emb-email"> avisar por e-mail</label>' +
            '<label style="font-weight:400;white-space:nowrap" ' +
              'title="Marque quando este número for uma confirmação REPETIDA do mesmo embarque: ' +
              'a mercadoria saiu uma vez só, então os itens não podem voltar para a lista de compra">' +
              '<input type="checkbox" id="cancel-emb-duplicado"> era embarque duplicado</label>' +
            '<button class="btn-principal" id="btn-cancelar-embarque" style="background:#B91C1C">Cancelar embarque</button>' +
          '</div>' +
          blocoAjuda(
            'Estorna o consumo de fio crú, devolve os itens à lista pendente e marca o embarque como ' +
            'CANCELADO. O e-mail já enviado não volta. Marcando <b>"era embarque duplicado"</b>, os itens ' +
            '<b>não</b> voltam para a lista pendente — use quando o mesmo embarque foi confirmado duas ' +
            'vezes por engano (a mercadoria saiu só uma vez).',
            'O que o cancelamento faz'
          ) +
          '<div id="cancel-emb-msg"></div>'
        : '') +
      '<div class="tabela-wrap" id="tabela-historico-embarque"></div>' +
    '</section>';

  // Sem passar o evento adiante: `confirmarEmbarqueSelecionado` recebe um
  // booleano (forçar duplicado), e um Event seria lido como `true`.
  document.getElementById('btn-confirmar-embarque').onclick = function () {
    confirmarEmbarqueSelecionado(false);
  };
  var btnHist = document.getElementById('btn-historico-embarque');
  if (btnHist) btnHist.onclick = togglePainelHistoricoEmbarque;
  var btnCancEmb = document.getElementById('btn-cancelar-embarque');
  if (btnCancEmb) btnCancEmb.onclick = cancelarEmbarquePorNumero;
  ligarControlesMalote();
  ativarRegua('tabela-embarque-confirmar');
  carregarListaConfirmarEmbarque();
  carregarCustoMaoObra();
  carregarProximoNumeroEmbarque();
}

/** Mostra o próximo número de embarque desta unidade e liga o link "ajustar"
 * (só master/almox1 — a mesma numeração que sai na Confirmação de Embarque). */
function carregarProximoNumeroEmbarque() {
  var alvo = document.getElementById('prox-num-embarque');
  if (!alvo) return; // só existe pra quem edita
  chamar('obterProximoNumeroEmbarque', sessao.token)
    .then(function (r) { alvo.textContent = r.numero != null ? r.numero : '—'; })
    .catch(function () { alvo.textContent = '—'; });

  var link = document.getElementById('link-ajustar-num-embarque');
  var form = document.getElementById('ajustar-num-embarque-form');
  var campo = document.getElementById('novo-num-embarque');
  if (link) {
    link.onclick = function (e) {
      e.preventDefault();
      form.style.display = form.style.display === 'none' ? 'inline' : 'none';
      if (form.style.display !== 'none') { campo.value = alvo.textContent !== '—' ? alvo.textContent : ''; campo.focus(); }
    };
  }
  var btn = document.getElementById('btn-salvar-num-embarque');
  if (btn) {
    btn.onclick = function () {
      var v = parseInt(campo.value, 10);
      if (!v || v < 1) { campo.focus(); return; }
      confirmarModal(
        'Ajustar o próximo número de embarque?',
        'O <b>próximo</b> embarque confirmado nesta unidade vai sair com o número <b>' + v + '</b> ' +
        '(os já confirmados não mudam). Use com cuidado — normalmente só é preciso uma vez, para ' +
        'alinhar a numeração com a sequência real.',
        'Salvar', 'Cancelar',
        function (ok) {
          if (!ok) return;
          btn.disabled = true;
          chamar('definirProximoNumeroEmbarque', sessao.token, v)
            .then(function () {
              btn.disabled = false;
              form.style.display = 'none';
              alvo.textContent = v;
            })
            .catch(function (err) {
              btn.disabled = false;
              var m = tratarErro(err);
              if (m) alert(m);
            });
        }
      );
    };
  }
}

/** Liga a caixa MALOTE: marcar abre as opções; o campo de volumes só fica
 * ativo na opção "nota separada" (ver `lerMaloteDaTela`). */
function ligarControlesMalote() {
  var chk = document.getElementById('chk-malote');
  if (!chk) return; // só existe pra quem edita
  chk.addEventListener('change', function () { atualizarControlesMalote(true); });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="malote-modo"]'), function (r) {
    r.addEventListener('change', function () { atualizarControlesMalote(true); });
  });
}

/** Mostra/esconde as opções do malote e habilita o campo de volumes só na
 * opção "nota separada". `focar` só é true quando veio de um clique. */
function atualizarControlesMalote(focar) {
  var chk = document.getElementById('chk-malote');
  if (!chk) return;
  var opcoes = document.getElementById('malote-opcoes');
  var campoVol = document.getElementById('malote-volumes');
  opcoes.style.display = chk.checked ? '' : 'none';
  var porVolumes = chk.checked && lerModoMalote() === 'volumes';
  campoVol.disabled = !porVolumes;
  if (!porVolumes) campoVol.value = '';
  else if (focar) campoVol.focus();
}

/** Zera o malote depois de confirmar (é por embarque, não deve “grudar”). */
function limparMalote() {
  var chk = document.getElementById('chk-malote');
  if (!chk) return;
  chk.checked = false;
  var fios = document.querySelector('input[name="malote-modo"][value="fios"]');
  if (fios) fios.checked = true;
  atualizarControlesMalote(false);
}

function lerModoMalote() {
  var m = document.querySelector('input[name="malote-modo"]:checked');
  return m ? m.value : 'fios';
}

/** Estado do malote conforme a tela: { ativo, modo, volumes }. */
function lerMaloteDaTela() {
  var chk = document.getElementById('chk-malote');
  if (!chk || !chk.checked) return { ativo: false, modo: '', volumes: '' };
  var modo = lerModoMalote();
  var campoVol = document.getElementById('malote-volumes');
  return {
    ativo: true, modo: modo,
    volumes: modo === 'volumes' ? (campoVol ? campoVol.value : '') : ''
  };
}

function cancelarEmbarquePorNumero() {
  var msg = document.getElementById('cancel-emb-msg');
  var numero = (document.getElementById('cancel-emb-num').value || '').trim();
  var avisar = document.getElementById('cancel-emb-email').checked;
  var chkDup = document.getElementById('cancel-emb-duplicado');
  var duplicado = !!(chkDup && chkDup.checked);
  if (!numero) { msg.innerHTML = '<div class="aviso erro">Informe o número do embarque.</div>'; return; }
  confirmarModal(
    'Cancelar embarque nº ' + numero + '?',
    'Isso vai <b>estornar o consumo de fio crú</b> desse embarque e marcar o embarque como CANCELADO. ' +
    (duplicado
      ? 'Como está marcado <b>"era embarque duplicado"</b>, os itens <b>NÃO</b> voltam para a lista pendente ' +
        '(a mercadoria saiu uma vez só, no embarque original).'
      : 'Os itens <b>voltam para a lista pendente</b> de compra.') +
    (avisar ? ' Um e-mail de cancelamento será enviado aos contatos.' : '') +
    ' O e-mail de confirmação original não pode ser desfeito.',
    'Cancelar embarque', 'Voltar',
    function (ok) {
      if (!ok) return;
      var btn = document.getElementById('btn-cancelar-embarque');
      btn.disabled = true;
      msg.innerHTML = '<div class="aviso"><span class="carregando">Cancelando…</span></div>';
      chamar('cancelarEmbarque', sessao.token, numero, avisar, !duplicado)
        .then(function (r) {
          btn.disabled = false;
          var extra = r.semInstantaneo
            ? ' (embarque antigo, sem instantâneo de estorno — confira o fio crú manualmente)'
            : '';
          var destino = r.devolveuPendencia
            ? r.itens + ' item(ns) devolvido(s) à pendência'
            : r.itens + ' item(ns) baixado(s) do histórico (duplicado — nada voltou para a pendência)';
          msg.innerHTML = '<div class="aviso ok">Embarque nº ' + r.numero + ' cancelado: ' + destino +
            ', ' + r.creditosCru + ' crédito(s) no fio crú' +
            (r.destinatarios ? ', e-mail para ' + r.destinatarios + ' destinatário(s)' : '') + '.' + extra + '</div>';
          document.getElementById('cancel-emb-num').value = '';
          if (chkDup) chkDup.checked = false;
          carregarHistoricoEmbarque();
          carregarListaConfirmarEmbarque(); // a lista pendente mudou
        })
        .catch(function (err) {
          btn.disabled = false;
          var m = tratarErro(err);
          if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
        });
    }
  );
}

/** Pré-preenche o campo de mão de obra com a última taxa usada nesta unidade. */
function carregarCustoMaoObra() {
  var campo = document.getElementById('custo-mao-obra');
  if (!campo) return; // só existe pra quem edita
  // Salva assim que o usuário sai do campo — não depende de completar uma
  // confirmação de embarque (que pode falhar por outro motivo, ou ser
  // barrada pela checagem de duplicidade) para o valor ficar guardado.
  var ultimoSalvo = campo.value;
  chamar('obterCustoMaoObra', sessao.token)
    .then(function (r) {
      if (r && r.custoMaoObra != null && r.custoMaoObra !== '') {
        campo.value = String(r.custoMaoObra).replace('.', ',');
      }
      ultimoSalvo = campo.value; // só depois de preenchido é que "nada mudou" faz sentido
    })
    .catch(function () {});
  campo.addEventListener('blur', function () {
    if (campo.value === ultimoSalvo) return; // nada mudou, não gasta chamada
    ultimoSalvo = campo.value;
    chamar('salvarCustoMaoObra', sessao.token, campo.value).catch(function () {});
  });
}

function togglePainelHistoricoEmbarque() {
  var painel = document.getElementById('painel-historico-embarque');
  var abrir = painel.style.display === 'none';
  painel.style.display = abrir ? '' : 'none';
  if (abrir) carregarHistoricoEmbarque();
}

function carregarHistoricoEmbarque() {
  var wrap = document.getElementById('tabela-historico-embarque');
  wrap.innerHTML = '<div class="aviso"><span class="carregando">Carregando…</span></div>';
  chamar('listarHistoricoEmbarquesConfirmados', sessao.token)
    .then(function (r) { renderHistoricoEmbarque(r.linhas); })
    .catch(function (err) {
      var m = tratarErro(err);
      if (m) wrap.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}

function renderHistoricoEmbarque(linhas) {
  var wrap = document.getElementById('tabela-historico-embarque');
  if (!linhas || !linhas.length) {
    wrap.innerHTML = '<div class="vazio">Nenhum embarque confirmado ainda.</div>';
    return;
  }
  var body = linhas.map(function (l) {
    var canc = String(l.situacao || '').toUpperCase().indexOf('CANCEL') !== -1;
    var chegou = String(l.situacao || '').toUpperCase().indexOf('CHEG') !== -1;
    return '<tr' + (canc ? ' style="opacity:.5;text-decoration:line-through"' : '') + '>' +
      '<td class="col-item">' + (l.item || '—') + '</td>' +
      '<td style="text-align:right">' + num(l.quantidade) + ' kg</td>' +
      '<td>' + (l.numero != null && l.numero !== '' ? l.numero : '—') + '</td>' +
      '<td>' + (l.data || '—') + '</td>' +
      '<td>' + (canc ? 'CANCELADO' : (chegou ? 'chegou' : '—')) + '</td>' +
    '</tr>';
  }).join('');
  wrap.innerHTML =
    '<table class="dados"><thead><tr>' +
      '<th style="width:32%">Item</th><th style="text-align:right;width:16%">Quantidade</th>' +
      '<th style="width:16%">Nº embarque</th><th style="width:20%">Data</th><th style="width:16%">Situação</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table>';
}

function carregarListaConfirmarEmbarque() {
  var msg = document.getElementById('embarque-msg');
  msg.innerHTML = '<div class="aviso"><span class="carregando">Carregando…</span></div>';
  return chamar('obterListaFioParaTingir', sessao.token)
    .then(function (r) {
      msg.innerHTML = '';
      // TODOS os itens em aberto, sem filtro nenhum: com o fluxo da
      // Quantidade Tingida pausado (ver `TINGIMENTO_PAUSADO`), é a expedição
      // que lança peso e volumes direto aqui — não existe mais "liberado
      // pelo Tingimento" filtrando o que ela pode ver.
      estadoConfirmarEmbarque.linhas = (r.linhas || []).map(function (l) {
        var o = {
          linha: l.linha, item: l.item, descricao: l.descricao, cliente: l.cliente,
          tipoFio: l.tipoFio, total: Number(l.total) || 0, tingido: l.tingido || 0,
          dataSolicitado: l.dataSolicitado || '',
          selecionado: false, doEstoque: false,
          volumes: (l.volumes === '' || l.volumes == null) ? '' : l.volumes
        };
        // Peso e observação: em branco por padrão (o que vale é o que a
        // expedição digitar agora). O RASCUNHO salvo — ver
        // `salvarRascunhoEmbarque` — é a digitação DELA MESMA, guardada pra
        // não se perder ao recarregar a tela nem ficar só no navegador de
        // quem digitou; por isso ele, sim, volta preenchido.
        var temRascunhoQtd = l.qtdRascunho !== '' && l.qtdRascunho != null;
        o.quantidade = temRascunhoQtd ? String(l.qtdRascunho) : '';
        var obsSalva = l.obsRascunho || '';
        o.obs = obsSalva === 'COMPLETO' ? '' : obsSalva;
        o.completo = obsSalva === 'COMPLETO';
        return o;
      });
      renderConfirmarEmbarque();
    })
    .catch(function (err) {
      var m = tratarErro(err);
      if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}

/** 'completo' (tingido cobriu o alvo), 'parcial' (já tem algo tingido, mas
 * não bateu o alvo, ou não há alvo calculado) ou 'nenhum'. */
function statusTingidoEmbarque(l) {
  var total = Number(l.total) || 0;
  var tingido = Number(l.tingido) || 0;
  if (tingido <= 0) return 'nenhum';
  if (total > 0 && tingido >= total) return 'completo';
  return 'parcial';
}

function renderConfirmarEmbarque() {
  var wrap = document.getElementById('tabela-embarque-confirmar');
  var btn = document.getElementById('btn-confirmar-embarque');
  var linhas = estadoConfirmarEmbarque.linhas;
  // Tingimento só VÊ esta tela (a confirmação final é do almoxarifado 1) —
  // master e almoxarifado1 editam. Ver `podeEditar`.
  var editavel = podeEditar(['master', 'almoxarifado1']);
  if (!linhas.length) {
    wrap.innerHTML = '<div class="vazio">Nenhum item pendente para embarque.</div>';
    btn.style.display = 'none';
    return;
  }
  var body = linhas.map(function (l, i) {
    // Badges de tingimento só fazem sentido pra item que TEM tingido lançado
    // (fluxo da Quantidade Tingida, hoje pausado — ver `TINGIMENTO_PAUSADO`).
    // Com ela pausada, `tingido` é 0 e a linha sai limpa, sem destaque nenhum.
    var status = statusTingidoEmbarque(l);
    var rowClass = status === 'completo' ? 'destaque-tingido-completo'
      : (status === 'parcial' ? 'destaque-tingido-parcial' : '');
    var badges = [];
    if (status === 'completo') badges.push('<span class="badge-tingido-completo">tingido completo</span>');
    else if (status === 'parcial') badges.push('<span class="badge-tingido-parcial">tingido parcial</span>');
    return '<tr' + (rowClass ? ' class="' + rowClass + '"' : '') + '>' +
      (editavel
        ? '<td style="text-align:center"><input type="checkbox" class="chk-grande chk-embarcar" data-idx="' + i +
          '"' + (l.selecionado ? ' checked' : '') + '></td>'
        : '') +
      '<td>' + (l.dataSolicitado ? l.dataSolicitado : '—') + '</td>' +
      '<td class="col-item">' + (l.item || '—') + '</td>' +
      '<td>' + (l.descricao ? l.descricao : '—') + '</td>' +
      '<td>' + (l.cliente ? l.cliente : '—') + '</td>' +
      '<td>' + (l.tipoFio ? l.tipoFio : '—') + '</td>' +
      '<td style="text-align:right">' + (l.total ? num(l.total) : '—') + '</td>' +
      // Volumes e peso: em branco por padrão — é a expedição que informa os
      // dois aqui, direto (ver `TINGIMENTO_PAUSADO`). Volumes grava na hora;
      // o peso vai no rascunho compartilhado até a confirmação.
      '<td style="text-align:center">' + (editavel
        ? '<input type="number" class="vol-input" data-linha="' + l.linha + '" data-idx="' + i + '" ' +
          'min="0" step="any" value="' + escAttr(l.volumes) + '" placeholder="vol." ' +
          'style="width:60px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:5px;text-align:right">'
        : num(l.volumes)) + '</td>' +
      '<td>' + (editavel
        ? '<input type="number" class="qtd-embarcar-input" data-idx="' + i + '" min="0" step="any" ' +
          'placeholder="kg" value="' + escAttr(l.quantidade) + '">'
        : num(l.quantidade) + ' kg') + '</td>' +
      '<td>' + (badges.length ? badges.join(' ') : '—') + '</td>' +
      (editavel
        ? '<td>' +
            '<label style="white-space:nowrap;font-size:11.5px;cursor:pointer">' +
              '<input type="checkbox" class="chk-obs-completo" data-idx="' + i + '"' +
              (l.completo ? ' checked' : '') + '> completo</label>' +
            (l.completo
              ? ''
              : '<input type="text" class="obs-embarcar-input" data-idx="' + i + '" ' +
                'placeholder="ex.: parcial — restante depois" value="' + escAttr(l.obs) + '" ' +
                'style="width:100%;box-sizing:border-box;margin-top:3px;padding:4px 6px;' +
                'border:1px solid #cbd5e1;border-radius:5px;font-size:12px">') +
          '</td>'
        : '') +
    '</tr>';
  }).join('');
  wrap.innerHTML =
    '<table class="dados"><thead><tr>' +
      (editavel ? '<th style="width:4%">Embarcar</th>' : '') + '<th style="width:6%">Solicitado em</th>' +
      '<th style="width:8%">Item</th><th style="width:' + (editavel ? '11' : '13') + '%">Descrição</th>' +
      '<th style="width:8%">Cliente</th><th style="width:8%">Tipo de fio</th>' +
      '<th style="text-align:right;width:5%">Alvo</th>' +
      '<th style="text-align:center;width:6%">Volumes</th>' +
      '<th style="width:10%">Peso (kg)</th>' +
      '<th style="width:' + (editavel
        ? '13%">Situação</th><th style="width:18%">Observação (e-mail)'
        : '24%">Situação') + '</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table>';

  if (editavel) {
    Array.prototype.forEach.call(wrap.querySelectorAll('.chk-embarcar'), function (chk) {
      chk.addEventListener('change', function () {
        estadoConfirmarEmbarque.linhas[Number(chk.getAttribute('data-idx'))].selecionado = chk.checked;
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.vol-input'), function (inp) {
      inp.addEventListener('change', function () { salvarVolumes(inp); });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.chk-obs-completo'), function (chk) {
      chk.addEventListener('change', function () {
        var l = estadoConfirmarEmbarque.linhas[Number(chk.getAttribute('data-idx'))];
        l.completo = chk.checked;
        // Salva na hora — vira "COMPLETO" marcado, ou a observação já digitada
        // (se desmarcado): outros usuários (e o master) enxergam sem recarregar.
        salvarRascunhoEmbarqueCampo(l.linha, 'EMBARQUE_OBS_RASCUNHO', l.completo ? 'COMPLETO' : (l.obs || ''));
        renderConfirmarEmbarque(); // mostra/esconde o campo de texto da observação
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.obs-embarcar-input'), function (inp) {
      inp.addEventListener('input', function () {
        estadoConfirmarEmbarque.linhas[Number(inp.getAttribute('data-idx'))].obs = inp.value;
      });
      // 'change' (dispara ao sair do campo) — não manda uma chamada a cada
      // tecla digitada, só quando o usuário termina de editar.
      inp.addEventListener('change', function () {
        var l = estadoConfirmarEmbarque.linhas[Number(inp.getAttribute('data-idx'))];
        salvarRascunhoEmbarqueCampo(l.linha, 'EMBARQUE_OBS_RASCUNHO', l.obs || '', inp);
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.qtd-embarcar-input'), function (inp) {
      inp.addEventListener('change', function () {
        var l = estadoConfirmarEmbarque.linhas[Number(inp.getAttribute('data-idx'))];
        l.quantidade = inp.value;
        // Guarda o peso digitado no rascunho compartilhado, pra não se perder
        // ao recarregar a tela (nem ficar só no navegador de quem digitou).
        // A tabela NÃO é redesenhada aqui: o usuário costuma preencher vários
        // itens em sequência, e recriar a tabela tiraria o foco do campo.
        salvarRascunhoEmbarqueCampo(l.linha, 'EMBARQUE_QTD_RASCUNHO', l.quantidade, inp);
      });
    });
  }
  btn.style.display = editavel ? '' : 'none';
  aplicarRegua(wrap);
}

/* Confirmação em andamento: enquanto for true, nenhum clique novo passa. É a
 * primeira barreira contra o clique duplo (a segunda é o servidor, que recusa
 * confirmação repetida — ver `_conferirEmbarqueDuplicado`). */
var confirmandoEmbarque = false;

function confirmarEmbarqueSelecionado(forcarDuplicado) {
  var msg = document.getElementById('embarque-msg');
  if (confirmandoEmbarque) {
    msg.innerHTML = '<div class="aviso">A confirmação anterior ainda está sendo enviada — ' +
      'aguarde o resultado antes de clicar de novo.</div>';
    return;
  }
  var selecionados = estadoConfirmarEmbarque.linhas.filter(function (l) {
    return l.selecionado && Number(l.quantidade) > 0;
  });
  if (!selecionados.length) {
    msg.innerHTML = '<div class="aviso erro">Marque ao menos um item, com quantidade maior que zero.</div>';
    return;
  }
  var totalKg = selecionados.reduce(function (acc, l) { return acc + Number(l.quantidade); }, 0);
  var campoCusto = document.getElementById('custo-mao-obra');
  var custoMaoObra = campoCusto ? campoCusto.value : '';
  var taxa = parseNumeroBR(custoMaoObra);
  var linhaMaoObra = taxa > 0
    ? ' Mão de obra: ' + moeda(taxa) + '/kg (total ' + moeda(totalKg * taxa) + ').'
    : ' Sem custo de mão de obra informado (R$ 0,00).';
  var totalVolumes = selecionados.reduce(function (acc, l) { return acc + (Number(l.volumes) || 0); }, 0);
  var linhaVolumes = ' Total de volumes dos fios: ' + num(totalVolumes) + '.';

  // Malote (ao lado da observação): sem volumes na opção de nota separada não
  // dá pra emitir a nota do malote — barra aqui, antes de gravar qualquer coisa.
  var malote = lerMaloteDaTela();
  if (malote.ativo && malote.modo === 'volumes' && !(Number(String(malote.volumes).replace(',', '.')) > 0)) {
    msg.innerHTML = '<div class="aviso erro">Malote com nota separada: informe a quantidade de volumes do ' +
      'malote (ou marque "segue com os fios").</div>';
    var campoVol = document.getElementById('malote-volumes');
    if (campoVol) campoVol.focus();
    return;
  }
  var linhaMalote = !malote.ativo ? ''
    : (malote.modo === 'volumes'
        ? ' Vai um MALOTE em nota separada, com ' + num(parseNumeroBR(malote.volumes)) + ' volume(s) — ' +
          'o PDF traz o campo pra emitir a nota só dele.'
        : ' Vai um MALOTE junto com os fios (mesma nota) — o PDF só informa.');

  var avisoForcado = forcarDuplicado
    ? '<b style="color:#B91C1C">ATENÇÃO: o sistema já identificou esta confirmação como repetida. ' +
      'Só siga se for mesmo um embarque NOVO — senão vai sair outro número, outro e-mail e a mão de ' +
      'obra vai ser cobrada de novo.</b> '
    : '';
  confirmarModal(
    forcarDuplicado ? 'Confirmar mesmo assim?' : 'Confirmar embarque?',
    avisoForcado +
    'Isso vai gravar ' + selecionados.length + ' item(ns) (total ' + num(totalKg) + ' kg) como embarcados, ' +
    'dar baixa na lista pendente de compra e no estoque de fio crú, e enviar o e-mail de confirmação ' +
    '(relatório em PDF anexo).' + linhaVolumes + linhaMaoObra + linhaMalote +
    ' Clique UMA vez e espere: o envio leva alguns segundos.',
    forcarDuplicado ? 'Sim, é um embarque novo' : 'Confirmar', 'Cancelar',
    function (ok) {
      if (!ok) return;
      var btn = document.getElementById('btn-confirmar-embarque');
      // Trava o botão (e qualquer clique novo) até a resposta do servidor.
      confirmandoEmbarque = true;
      btn.disabled = true;
      var rotuloBtn = btn.textContent;
      btn.textContent = 'Confirmando…';
      msg.innerHTML = '<div class="aviso"><span class="carregando">Confirmando e enviando e-mail… ' +
        'não feche a página nem clique de novo (leva alguns segundos).</span></div>';
      var liberar = function () {
        confirmandoEmbarque = false;
        btn.disabled = false;
        btn.textContent = rotuloBtn;
      };
      var itens = selecionados.map(function (l) {
        return {
          item: l.item, quantidade: Number(l.quantidade), doEstoque: !!l.doEstoque,
          volumes: l.volumes,
          // "Completo" marcado dispensa digitação; senão vai o texto digitado.
          obs: l.completo ? 'COMPLETO' : String(l.obs || '').trim()
        };
      });
      var campoObs = document.getElementById('obs-embarque');
      var observacao = campoObs ? campoObs.value : '';
      chamar('confirmarEmbarqueManual', sessao.token,
        { itens: itens, custoMaoObra: custoMaoObra, observacao: observacao, malote: malote,
          confirmarDuplicado: !!forcarDuplicado })
        .then(function (r) {
          liberar();
          var resumoTxt = r.resumo.map(function (g) {
            return g.tipoFio + ': ' + num(g.totalTingido) + ' kg' +
              (g.totalEstoque ? ' + ' + num(g.totalEstoque) + ' kg do estoque' : '') +
              (g.maoObra ? ' (' + moeda(g.maoObra) + ')' : '');
          }).join(' · ');
          var maloteTxt = (r.malote && r.malote.ativo)
            ? ' Malote: ' + (r.malote.modo === 'volumes'
                ? num(r.malote.volumes) + ' volume(s) em nota separada.'
                : 'segue com os fios.')
            : '';
          msg.innerHTML = '<div class="aviso ok">Embarque nº ' + r.numero + ' confirmado (' + r.gravados +
            ' item(ns), ' + num(r.volumesTotal) + ' volume(s)) — e-mail com PDF enviado para ' +
            r.destinatarios + ' destinatário(s). ' + resumoTxt + maloteTxt + '</div>';
          limparMalote(); // é por embarque: não deixa marcado pro próximo
          carregarListaConfirmarEmbarque();
        })
        .catch(function (err) {
          liberar();
          var m = tratarErro(err);
          if (!m) return;
          // O servidor recusou por parecer reenvio (clique duplo). Mostra o
          // motivo e deixa a decisão com o usuário, com um botão explícito.
          if (m.indexOf('DUPLICADO:') !== -1) {
            msg.innerHTML = '<div class="aviso erro">' +
              escAttr(m.replace(/^.*DUPLICADO:\s*/, '')) +
              '<div style="margin-top:10px">' +
                '<button class="btn-principal" id="btn-forcar-embarque" style="background:#B91C1C">' +
                'Confirmar mesmo assim</button>' +
                '<button class="btn-principal" id="btn-ver-historico-dup" ' +
                'style="background:#475569;margin-left:8px">Ver histórico de embarques</button>' +
              '</div></div>';
            document.getElementById('btn-forcar-embarque').onclick = function () {
              confirmarEmbarqueSelecionado(true);
            };
            document.getElementById('btn-ver-historico-dup').onclick = function () {
              var painel = document.getElementById('painel-historico-embarque');
              if (painel) { painel.style.display = ''; carregarHistoricoEmbarque(); }
            };
            return;
          }
          msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
        });
    }
  );
}

/** Ordena a lista do tingimento pela data limite de embarque, a mais próxima
 * primeiro (mesmo critério do servidor) — usada ao reordenar na tela depois
 * de editar uma data, sem precisar recarregar tudo do zero. */
function ordenarTingimentoPorDataLimite(linhas) {
  function ms(s) {
    var m = String(s == null ? '' : s).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : null;
  }
  return linhas.slice().sort(function (a, b) {
    var da = ms(a.dataLimite), db = ms(b.dataLimite);
    if (da == null && db == null) return 0;
    if (da == null) return 1;
    if (db == null) return -1;
    return da - db;
  });
}

/** Extrai só a data (dd/MM/aaaa) de um valor que pode vir como ISO/Date/texto. */
function soDataBR(v) {
  var s = String(v == null ? '' : v);
  var m = s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return m[0];
  var iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[3] + '/' + iso[2] + '/' + iso[1];
  return s;
}

/** dd/MM/aaaa → aaaa-MM-dd (para o input date); '' se não reconhecer. */
function brParaISO(s) {
  var m = String(s == null ? '' : s).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
}
/** aaaa-MM-dd → dd/MM/aaaa (para gravar como na planilha); '' se vazio. */
function isoParaBR(s) {
  var m = String(s == null ? '' : s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}

function salvarCampoTing(inp, campo, valor, aoSalvar) {
  inp.style.borderColor = '#CBD5E1';
  chamar('salvarCampoTingimento', sessao.token, inp.getAttribute('data-linha'), campo, valor)
    .then(function () {
      inp.style.borderColor = '#1F9D55';
      if (aoSalvar) aoSalvar();
    })
    .catch(function (err) {
      inp.style.borderColor = '#D0342C';
      tratarErro(err);
    });
}

/* ------------------------ view: Quantidade Tingida ------------------ */
// Aba SEPARADA da "Relação de compra / Tingimento" (que fica intocada) —
// pensada pra virar, no futuro, o trabalho de um grupo de usuários à parte.
// É a mesma lista do Pedido de Fio (mesmo número/data), e é dela que começa
// o processo de baixa do fio crú. Por ora só o master usa (ver `exigirSessao`).
var estadoQuantidadeTingida = { linhas: [] };

/**
 * Fluxo da Quantidade Tingida PAUSADO por decisão do usuário: quem lança
 * peso e volumes agora é a expedição, direto na tela Confirmar Embarque
 * (que passou a listar todos os itens em aberto). Enquanto true, esta tela
 * fica só de consulta — nada de lançar tingido, corrigir total ou liberar
 * pra embarque.
 *
 * Nada foi apagado: as funções do servidor (`registrarQuantidadeTingida`,
 * `corrigirQuantidadeTingida`, `liberarParaEmbarque`) e os controles da tela
 * continuam no código. Pra voltar ao fluxo em duas etapas (Tingimento libera
 * → expedição confirma), basta trocar isto pra false e refazer o filtro de
 * liberados em `carregarListaConfirmarEmbarque`.
 */
var TINGIMENTO_PAUSADO = true;

function viewQuantidadeTingida(alvo) {
  var desc = TINGIMENTO_PAUSADO
    ? 'Somente consulta. O lançamento de peso e volumes está sendo feito na tela ' +
      '<b>Confirmar Embarque</b>, pela expedição — o que vale hoje é o que for informado e marcado lá.'
    : (podeEditar(['master', 'tingimento'])
      ? 'Digite em "+ kg agora" quanto foi tingido e clique em <b>Confirmar</b> — soma ao total já lançado e ' +
        'dá baixa no fio crú daquele tipo de fio (pode fazer isso várias vezes, aos poucos, conforme for ' +
        'tingindo). Errou um lançamento (ou foi só um teste)? Use o botão <b>✎</b> ao lado do "Já tingido" ' +
        'pra corrigir o total pro valor certo. Quando parte (ou tudo) do que já foi tingido estiver pronta ' +
        'pra sair, use <b>"Liberar p/ embarque"</b>: informe a quantidade e os volumes desse lote e clique em ' +
        '<b>Liberar</b> — só o que for liberado aparece pra expedição confirmar, na tela Confirmar Embarque. ' +
        'Se tingiu mais do que decidiu liberar, o restante fica RETIDO aqui mesmo (não aparece pra expedição) ' +
        'até você liberar também — a quantidade a liberar já vem sugerida com tudo que está tingido, edite ' +
        'pra baixo se só parte estiver pronta. Depois que o embarque for confirmado, o que sobrar volta a ' +
        'aparecer com "Já tingido" e volumes ZERADOS, como se fosse uma quantidade nova do mesmo item. Use as ' +
        'setas ↑/↓ (ou clique numa linha) para navegar item por item.'
      : 'Somente consulta — quem lança a quantidade tingida é o papel Tingimento.');
  alvo.innerHTML =
    '<section class="painel">' +
      '<h2>Quantidade Tingida</h2>' +
      (TINGIMENTO_PAUSADO
        ? '<div class="aviso" style="border-left:4px solid #F0C36D;background:#FFFBEB">' +
            '<b>Lançamentos pausados nesta tela.</b> Peso e volumes são informados agora na tela ' +
            '<b>Confirmar Embarque</b>. Esta lista fica aqui só para consulta.</div>'
        : '') +
      '<p class="desc">Lista do Pedido de Fio nº <b id="qt-numero-pedido">—</b> (<b id="qt-data-pedido">—</b>). ' +
      desc + '</p>' +
      '<div id="qt-msg"></div>' +
      '<div class="tabela-wrap" id="tabela-qtd-tingida"></div>' +
    '</section>';
  ativarRegua('tabela-qtd-tingida');
  carregarQuantidadeTingida();
}

function carregarQuantidadeTingida() {
  var msg = document.getElementById('qt-msg');
  msg.innerHTML = '<div class="aviso"><span class="carregando">Carregando…</span></div>';
  chamar('obterListaFioParaTingir', sessao.token)
    .then(function (r) {
      msg.innerHTML = '';
      document.getElementById('qt-numero-pedido').textContent = r.numeroPedido != null ? r.numeroPedido : '—';
      document.getElementById('qt-data-pedido').textContent = r.dataPedido || '—';
      estadoQuantidadeTingida.linhas = r.linhas || [];
      renderQuantidadeTingida();
    })
    .catch(function (err) {
      var m = tratarErro(err);
      if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}

/** Salva o nº de volumes de um item — usado só na Confirmar Embarque, pra o
 * almoxarifado 1 corrigir os volumes do lote liberado quando o Tingimento
 * informou errado (ver `liberarParaEmbarque`, em Consultas.gs, que é quem
 * grava os volumes na origem, junto com a liberação). */
function salvarVolumes(inp) {
  var linha = Number(inp.getAttribute('data-linha'));
  if (!linha) return;
  inp.disabled = true;
  chamar('salvarVolumesItem', sessao.token, linha, inp.value)
    .then(function (r) {
      inp.disabled = false;
      inp.style.borderColor = '#1E8E5A'; // confirma visualmente que salvou
      setTimeout(function () { inp.style.borderColor = '#cbd5e1'; }, 900);
      // mantém o estado local em sincronia (as duas telas usam `volumes`)
      var alvo = null;
      (estadoQuantidadeTingida.linhas || []).forEach(function (l) { if (l.linha === linha) alvo = l; });
      (estadoConfirmarEmbarque.linhas || []).forEach(function (l) { if (l.linha === linha) alvo = l; });
      if (alvo) alvo.volumes = r.volumes;
    })
    .catch(function (err) {
      inp.disabled = false;
      inp.style.borderColor = '#D0342C';
      // Antes o erro só deixava a borda vermelha, sem dizer o motivo — quem
      // usa a tela ficava sem saber por que a gravação falhou. Mostra a
      // mensagem no aviso da tela (Quantidade Tingida ou Confirmar Embarque,
      // o que estiver ativo) e também como dica ao passar o mouse no campo.
      var m = tratarErro(err);
      inp.title = m || '';
      var msgDiv = document.getElementById('qt-msg') || document.getElementById('embarque-msg');
      if (m && msgDiv) msgDiv.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}

/**
 * Salva um campo do rascunho compartilhado da Confirmar Embarque (quantidade
 * a confirmar ou observação — ver `salvarRascunhoEmbarque`, no servidor),
 * assim que o usuário termina de editar. `inp` é opcional — só serve pra dar
 * o feedback visual (borda verde/vermelha); passe null quando o campo for
 * recriado logo em seguida (ex.: a tabela é redesenhada por causa do
 * destaque "editado").
 */
function salvarRascunhoEmbarqueCampo(linha, campo, valor, inp) {
  if (!linha) return;
  if (inp) inp.disabled = true;
  chamar('salvarRascunhoEmbarque', sessao.token, linha, campo, valor)
    .then(function () {
      if (!inp) return;
      inp.disabled = false;
      inp.style.borderColor = '#1E8E5A';
      setTimeout(function () { inp.style.borderColor = '#cbd5e1'; }, 900);
    })
    .catch(function (err) {
      if (inp) { inp.disabled = false; inp.style.borderColor = '#D0342C'; }
      tratarErro(err);
    });
}

function renderQuantidadeTingida() {
  var wrap = document.getElementById('tabela-qtd-tingida');
  var linhas = estadoQuantidadeTingida.linhas;
  if (!linhas.length) {
    wrap.innerHTML = '<div class="vazio">Nenhum item pendente para tingir.</div>';
    return;
  }
  // Almoxarifado 1 só VÊ esta tela (não lança tingimento) — master e
  // tingimento editam. Ver `podeEditar`. Com o fluxo pausado
  // (`TINGIMENTO_PAUSADO`), ninguém edita: a tela vira só consulta.
  var editavel = !TINGIMENTO_PAUSADO && podeEditar(['master', 'tingimento']);
  var body = linhas.map(function (l, i) {
    var liberado = Number(l.liberado) || 0;
    // Prefill da quantidade a liberar: se já tem algo liberado (ainda não
    // embarcado), mostra o que está liberado agora, editável; senão sugere
    // liberar tudo que já foi tingido (o caso mais comum) — o usuário edita
    // pra baixo quando só parte estiver pronta de verdade.
    var qtdLiberarPrefill = liberado > 0 ? liberado : (l.tingido || '');
    return '<tr>' +
      '<td>' + (l.dataSolicitado ? l.dataSolicitado : '—') + '</td>' +
      '<td class="col-item">' + (l.item || '—') + '</td>' +
      '<td>' + (l.descricao ? l.descricao : '—') + '</td>' +
      '<td>' + (l.cliente ? l.cliente : '—') + '</td>' +
      '<td>' + (l.tipoFio ? l.tipoFio : '—') + '</td>' +
      '<td>' + (l.maquinas ? l.maquinas : '—') + '</td>' +
      '<td style="text-align:right">' + num(l.total) + '</td>' +
      '<td style="text-align:right">' + num(l.tingido) + ' kg ' +
        (editavel
          ? '<button type="button" class="btn-atualizar-data btn-corrigir-tingido" data-idx="' + i +
            '" title="Corrigir o total tingido lançado (ex.: desfazer um lançamento errado)">✎</button>'
          : '') +
      '</td>' +
      (editavel
        ? '<td style="text-align:center">' +
            '<input type="number" class="qtd-input-grande" data-idx="' + i + '" min="0" step="any" placeholder="+ kg">' +
          '</td>' +
          '<td style="text-align:center">' +
            '<button type="button" class="btn-atualizar-data btn-confirmar-tingido" data-idx="' + i +
              '" title="Registrar essa quantidade tingida e dar baixa no fio crú">Confirmar</button>' +
          '</td>'
        : '') +
      // LIBERAR P/ EMBARQUE: quanto do "Já tingido" está pronto de verdade —
      // pode ser menos que o total (o resto fica RETIDO, sem aparecer em
      // Confirmar Embarque, ver `carregarListaConfirmarEmbarque`). Os volumes
      // vão junto: agora são os volumes DESSE lote liberado, não do item todo.
      (editavel
        ? '<td>' +
            '<div style="display:flex;gap:4px;margin-bottom:4px">' +
              '<input type="number" class="liberar-qtd-input" data-idx="' + i + '" min="0" step="any" ' +
                'value="' + escAttr(qtdLiberarPrefill) + '" placeholder="kg" ' +
                'style="width:56px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:5px;text-align:right">' +
              '<input type="number" class="liberar-vol-input" data-idx="' + i + '" min="0" step="any" ' +
                'value="' + escAttr(l.volumes) + '" placeholder="vol." ' +
                'style="width:46px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:5px;text-align:right">' +
            '</div>' +
            '<button type="button" class="btn-atualizar-data btn-liberar-embarque" data-idx="' + i +
              '" title="Liberar essa quantidade (e volumes) pra expedição confirmar embarque">Liberar</button>' +
            (liberado > 0
              ? '<div style="font-size:11px;color:#1E8E5A;margin-top:3px">Liberado: ' + num(liberado) + ' kg</div>'
              : '') +
          '</td>'
        : '<td style="text-align:center">' +
            (liberado > 0
              ? num(liberado) + ' kg' + (l.volumes !== '' && l.volumes != null ? ' (' + num(l.volumes) + ' vol.)' : '')
              : '—') +
          '</td>') +
    '</tr>';
  }).join('');
  wrap.innerHTML =
    '<table class="dados"><thead><tr>' +
      '<th style="width:8%">Solicitado em</th>' +
      '<th style="width:9%">Item</th><th style="width:15%">Descrição</th>' +
      '<th style="width:9%">Cliente</th><th style="width:9%">Tipo de fio</th>' +
      '<th style="width:6%">Máquinas</th><th style="text-align:right;width:6%">Total (kg)</th>' +
      '<th style="text-align:right;width:7%">Já tingido</th>' +
      (editavel ? '<th style="width:9%">+ kg agora</th><th style="width:7%">Confirmar</th>' : '') +
      '<th style="width:12%">Liberar p/ embarque</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table>';

  if (editavel) {
    Array.prototype.forEach.call(wrap.querySelectorAll('.btn-confirmar-tingido'), function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        var inp = wrap.querySelector('.qtd-input-grande[data-idx="' + idx + '"]');
        lancarQuantidadeTingidaFio(idx, inp, btn);
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.btn-liberar-embarque'), function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        liberarItemParaEmbarque(idx, btn);
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.btn-corrigir-tingido'), function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        var alvo = estadoQuantidadeTingida.linhas[idx];
        if (!alvo) return;
        abrirModalCorrigirTingido(alvo.item, alvo.tingido || 0, function (novoTotal) {
          var msg = document.getElementById('qt-msg');
          btn.disabled = true;
          chamar('corrigirQuantidadeTingida', sessao.token, alvo.item, novoTotal)
            .then(function () {
              btn.disabled = false;
              alvo.tingido = novoTotal;
              renderQuantidadeTingida();
              msg.innerHTML = '<div class="aviso ok">Total tingido de "' + alvo.item + '" corrigido para ' +
                num(novoTotal) + ' kg.</div>';
            })
            .catch(function (err) {
              btn.disabled = false;
              var m = tratarErro(err);
              if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
            });
        });
      });
    });
  }
  aplicarRegua(wrap);
}

/** Modal pra corrigir o total tingido já lançado de um item — pede o valor
 * CORRETO (absoluto), não a diferença; o servidor ajusta a baixa no fio crú
 * pra bater com o novo total (credita de volta se for menor — ver
 * `corrigirQuantidadeTingida`). Serve tanto pra corrigir um valor digitado
 * errado quanto pra desfazer um lançamento de teste (corrigindo pro valor
 * de antes, ou pra zero). */
function abrirModalCorrigirTingido(item, tingidoAtual, callback) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,33,.45);' +
    'display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  overlay.innerHTML =
    '<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;' +
      'padding:26px 26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.28)">' +
      '<h3 style="margin:0 0 8px;color:#0B4576;font-size:17px">Corrigir quantidade tingida</h3>' +
      '<p style="margin:0 0 16px;color:#475569;font-size:14px;line-height:1.5">' +

        'Informe o valor CORRETO do total (não a diferença) — o sistema ajusta a baixa no fio crú pra ' +

        'de teste, informe o valor de antes).</p>' +

          'style="width:100%;padding:8px 10px;border:1px solid #D8E0E8;border-radius:8px;font-size:14px;box-sizing:border-box">' +
      '</div>' +

          'background:#0F5FA0;color:#fff;cursor:pointer;font-size:14px;font-weight:600">Corrigir</button>' +

  document.body.appendChild(overlay);

  var erroEl = overlay.querySelector('#modal-corrigir-erro');
  function fechar() { document.body.removeChild(overlay); }

  overlay.querySelector('#modal-btn-destaque').onclick = function () {
    var novoTotal = Number(inp.value);

      erroEl.textContent = 'Informe um valor válido (zero ou maior).'; return;
    }

/** Lança a quantidade tingida digitada (soma ao total já registrado daquele
 * item) e dá baixa no fio crú — ver `registrarQuantidadeTingida`. Disparado
 * pelo clique no botão "Confirmar" (era uma caixa de marcar antes — virou
 * botão porque é uma ação de disparo único, não um estado que fica marcado). */
function lancarQuantidadeTingidaFio(idx, inp, btn) {
  var msg = document.getElementById('qt-msg');
  var alvo = estadoQuantidadeTingida.linhas[idx];
  var quantidade = inp ? Number(inp.value) : NaN;
  if (!alvo || !inp || inp.value === '' || isNaN(quantidade) || quantidade <= 0) {
    if (inp) inp.style.borderColor = '#D0342C';
    return;
  }

  btn.disabled = true; inp.disabled = true;
  chamar('registrarQuantidadeTingida', sessao.token, { item: alvo.item, quantidade: quantidade })
    .then(function (r) {
      btn.disabled = false; inp.disabled = false;
      inp.value = ''; inp.style.borderColor = '';
      alvo.tingido = (alvo.tingido || 0) + quantidade;
      renderQuantidadeTingida();
      var nfsTxt = r.lotes.map(function (l) { return 'NF ' + l.nf + ' (saldo: ' + num(l.saldoApos) + ' kg)'; }).join(', ');
      msg.innerHTML = '<div class="aviso ok">Baixa no fio crú (' + r.tipoFio + ', ' + quantidade + ' kg): ' + nfsTxt + '.</div>';
    })
    .catch(function (err) {
      btn.disabled = false; inp.disabled = false;
      var m = tratarErro(err);
      if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}

/** Libera uma quantidade (com os volumes daquele lote) pra expedição
 * confirmar embarque — ver `liberarParaEmbarque`. Substitui o valor liberado
 * anterior (não soma); liberar 0 tira o item de Confirmar Embarque. */
function liberarItemParaEmbarque(idx, btn) {
  var wrap = document.getElementById('tabela-qtd-tingida');
  var alvo = estadoQuantidadeTingida.linhas[idx];
  if (!alvo) return;
  var msg = document.getElementById('qt-msg');
  var qtdInp = wrap.querySelector('.liberar-qtd-input[data-idx="' + idx + '"]');
  var volInp = wrap.querySelector('.liberar-vol-input[data-idx="' + idx + '"]');
  var quantidade = qtdInp ? Number(qtdInp.value) : NaN;
  if (!qtdInp || qtdInp.value === '' || isNaN(quantidade) || quantidade < 0) {
    if (qtdInp) qtdInp.style.borderColor = '#D0342C';
    return;
  }
  var volumes = volInp ? volInp.value : '';

  btn.disabled = true; qtdInp.disabled = true; if (volInp) volInp.disabled = true;
  chamar('liberarParaEmbarque', sessao.token, alvo.linha, quantidade, volumes)
    .then(function (r) {
      alvo.liberado = r.liberado;
      alvo.volumes = r.volumes;
      renderQuantidadeTingida();
      msg.innerHTML = r.liberado > 0
        ? '<div class="aviso ok">Liberado ' + num(r.liberado) + ' kg de "' + alvo.item + '" pra expedição confirmar embarque.</div>'
        : '<div class="aviso">Item "' + alvo.item + '" não está mais liberado pra expedição.</div>';
    })
    .catch(function (err) {
      btn.disabled = false; qtdInp.disabled = false; if (volInp) volInp.disabled = false;
      var m = tratarErro(err);
      if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}

/** 'dd/MM/aaaa' (como vem do servidor) → milissegundos, pra comparar datas no filtro. */
function _dataBRparaMs(s) {
  var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : null;
}
/** 'aaaa-MM-dd' (input date) → milissegundos locais, sem risco de fuso horário. */
function _isoParaMsLocal(iso) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null;
}

function _linhasFioCruFiltradas() {
  var f = estadoFioCru.filtro;
  var tipoBusca = (f.tipoFio || '').trim().toLowerCase();
  var nfBusca = (f.nf || '').trim().toLowerCase();
  var deMs = f.dataDe ? _isoParaMsLocal(f.dataDe) : null;
  var ateMs = f.dataAte ? _isoParaMsLocal(f.dataAte) + 86399999 : null; // até o fim daquele dia
  return estadoFioCru.linhas.filter(function (l) {
    if (tipoBusca && String(l.tipoFio || '').toLowerCase().indexOf(tipoBusca) === -1) return false;
    if (nfBusca && String(l.nf || '').toLowerCase().indexOf(nfBusca) === -1) return false;
    if (deMs != null || ateMs != null) {
      var d = _dataBRparaMs(l.data);
      if (d == null) return false;
      if (deMs != null && d < deMs) return false;
      if (ateMs != null && d > ateMs) return false;
    }
    return true;
  });
}

function renderEstoqueFioCru() {
  var wrap = document.getElementById('tabela-fiocru');
  if (!estadoFioCru.linhas.length) {
    wrap.innerHTML = '<div class="vazio">Nenhum lote de fio crú cadastrado ainda.</div>';
    return;
  }
  var linhas = _linhasFioCruFiltradas();
  if (!linhas.length) {
    wrap.innerHTML = '<div class="vazio">Nenhum lote encontrado com esse filtro.</div>';
    return;
  }

  function campo(l, editando, nomeCampo, valor, tipo) {
    if (!editando) {
      if (tipo === 'numero') return valor ? num(valor) : '—';
      return (valor === '' || valor == null) ? '—' : valor;
    }
    if (tipo === 'data') {
      return '<input type="date" class="fc-edit" data-linha="' + l.linha + '" data-campo="DATA" value="' +
        brParaISO(valor) + '">';
    }
    if (tipo === 'numero') {
      return '<input type="number" class="fc-edit" data-linha="' + l.linha + '" data-campo="' + nomeCampo +
        '" min="0" step="any" value="' + (valor || '') + '">';
    }
    return '<input class="fc-edit" data-linha="' + l.linha + '" data-campo="' + nomeCampo + '" value="' +
      escAttr(valor) + '">';
  }

  var body = linhas.map(function (l) {
    var cancelado = String(l.situacao || '').trim().toUpperCase() === 'CANCELADO';
    var editando = !!estadoFioCru.editando[l.linha];
    var auditoria = l.editadoEm ? ('editado ' + l.editadoEm + ' por ' + (l.editadoPor || '—')) : '—';
    return '<tr' + (cancelado ? ' style="opacity:.55"' : (l.saldo <= 0 ? ' class="destaque"' : '')) + '>' +
      '<td style="text-align:center"><input type="checkbox" class="chk-grande chk-editar-lote" data-linha="' +
        l.linha + '"' + (editando ? ' checked' : '') + ' title="Marcar para editar este lote"></td>' +
      '<td class="col-item">' + campo(l, editando, 'TIPO_FIO', l.tipoFio) + '</td>' +
      '<td>' + campo(l, editando, 'NF', l.nf) + '</td>' +
      '<td>' + campo(l, editando, 'FORNECEDOR', l.fornecedor) + '</td>' +
      '<td title="Valor recebido na NF — fixo, nunca editável (garante o histórico de entrada)">' +
        (l.quantidade ? num(l.quantidade) : '—') + '</td>' +
      '<td>' + campo(l, editando, 'PRECO_UNITARIO', l.precoUnitario, 'numero') + '</td>' +
      '<td>' + campo(l, editando, 'DATA', l.data, 'data') + '</td>' +
      '<td style="text-align:right">' + num(l.saldo) +
        (l.ajustado ? '<br><span style="font-size:10px;color:var(--texto-fraco)">ajuste: ' +
          (l.ajustado > 0 ? '+' : '') + num(l.ajustado) + '</span>' : '') + '</td>' +
      '<td style="text-align:center"><input type="checkbox" class="chk-inicio-baixa" data-linha="' + l.linha + '"' +
        (l.inicioBaixa ? ' checked' : '') +
        ' title="Marcar esta NF como início da baixa deste tipo de fio (ignora as mais antigas que ela)"></td>' +
      '<td>' + (cancelado ? 'CANCELADO' : '—') + '</td>' +

          '" title="Ajustar saldo (ex.: contagem física) sem alterar a quantidade original da NF">⚖</button> ' +
        '<button type="button" class="btn-atualizar-data btn-cancelar-nf" data-linha="' + l.linha +
        '" data-cancelado="' + (cancelado ? '0' : '1') + '">' + (cancelado ? '↺' : '✕') + '</button></td>' +
    '</tr>';
  }).join('');
  wrap.innerHTML =
    '<table class="dados"><thead><tr>' +
      '<th style="width:5%">Editar</th>' +
      '<th style="width:11%">Tipo de fio</th><th style="width:6%">NF</th><th style="width:9%">Fornecedor</th>' +

      '<th style="width:7%">Situação</th><th style="width:14%">Última edição</th><th style="width:6%"></th>' +
    '</tr></thead><tbody>' + body + '</tbody></table>';

  Array.prototype.forEach.call(wrap.querySelectorAll('.chk-editar-lote'), function (chk) {
    chk.addEventListener('change', function () {
      estadoFioCru.editando[Number(chk.getAttribute('data-linha'))] = chk.checked;
      renderEstoqueFioCru();
    });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll('.fc-edit'), function (inp) {
    inp.addEventListener('change', function () {
      salvarCampoFioCru(inp, Number(inp.getAttribute('data-linha')), inp.getAttribute('data-campo'), inp.value);
    });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll('.chk-inicio-baixa'), function (chk) {
    chk.addEventListener('change', function () {
      var linha = Number(chk.getAttribute('data-linha'));

      chk.disabled = true;
      chamar(marcar ? 'definirInicioBaixaFioCru' : 'removerInicioBaixaFioCru', sessao.token, linha)
        .then(function () { carregarEstoqueFioCru(); })
        .catch(function (err) { chk.disabled = false; chk.checked = !marcar; tratarErro(err); });
    });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll('.btn-cancelar-nf'), function (btn) {

        .then(function () { carregarEstoqueFioCru(); })
        .catch(function (err) { btn.disabled = false; tratarErro(err); });
    });

          .then(function () { carregarEstoqueFioCru(); carregarAjustesFioCru(); })
          .catch(function (err) { btn.disabled = false; tratarErro(err); });
      });
    });
  });
}

/** Modal pra registrar um ajuste manual de saldo (ex.: contagem física) — nunca
 * altera a QUANTIDADE original da NF, só soma/subtrai do saldo, com motivo e
 * autoria registrados (ver `ajustarSaldoFioCru`). Evita prompt() nativo pelo
 * mesmo motivo do `confirmarModal`: o sandbox do HtmlService pode bloqueá-lo. */
function abrirModalAjusteSaldoFioCru(lote, callback) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,33,.45);' +
    'display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  overlay.innerHTML =
    '<div style="background:#fff;border-radius:14px;max-width:440px;width:100%;' +
      'padding:26px 26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.28)">' +
      '<h3 style="margin:0 0 8px;color:#0B4576;font-size:17px">Ajustar saldo</h3>' +
      '<p style="margin:0 0 18px;color:#475569;font-size:14px;line-height:1.5">' +
        'NF ' + escAttr(lote.nf) + ' — ' + escAttr(lote.tipoFio) + '. Saldo atual: <b>' + num(lote.saldo) + ' kg</b>. ' +
        'A quantidade original recebida na NF não é alterada — isto só corrige o saldo, com um lançamento ' +
        'à parte, auditado.</p>' +
      '<div style="margin-bottom:14px">' +
        '<label style="display:block;font-size:13px;color:#334155;margin-bottom:4px">' +
          'Diferença a aplicar no saldo (kg — negativo para reduzir)</label>' +
        '<input type="number" id="modal-ajuste-delta" step="any" ' +
          'style="width:100%;padding:8px 10px;border:1px solid #D8E0E8;border-radius:8px;font-size:14px;box-sizing:border-box">' +
      '</div>' +
      '<div style="margin-bottom:8px">' +
        '<label style="display:block;font-size:13px;color:#334155;margin-bottom:4px">Motivo</label>' +
        '<input type="text" id="modal-ajuste-motivo" placeholder="ex.: contagem física de 20/07" ' +
          'style="width:100%;padding:8px 10px;border:1px solid #D8E0E8;border-radius:8px;font-size:14px;box-sizing:border-box">' +
      '</div>' +
      '<div id="modal-ajuste-erro" style="color:#D0342C;font-size:13px;min-height:18px;margin-bottom:6px"></div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">' +
        '<button id="modal-btn-secundario" style="padding:10px 16px;border:1px solid #D8E0E8;' +
          'border-radius:8px;background:#fff;cursor:pointer;font-size:14px">Cancelar</button>' +
        '<button id="modal-btn-destaque" style="padding:10px 18px;border:none;border-radius:8px;' +
          'background:#0F5FA0;color:#fff;cursor:pointer;font-size:14px;font-weight:600">Ajustar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  var inpDelta = overlay.querySelector('#modal-ajuste-delta');
  var inpMotivo = overlay.querySelector('#modal-ajuste-motivo');
  var erroEl = overlay.querySelector('#modal-ajuste-erro');
  function fechar() { document.body.removeChild(overlay); }
  overlay.querySelector('#modal-btn-secundario').onclick = fechar;
  overlay.querySelector('#modal-btn-destaque').onclick = function () {
    var delta = Number(inpDelta.value);
    var motivo = inpMotivo.value.trim();
    if (inpDelta.value === '' || isNaN(delta) || delta === 0) {
      erroEl.textContent = 'Informe uma diferença de saldo diferente de zero.'; return;
    }
    if (!motivo) {
      erroEl.textContent = 'Informe o motivo do ajuste.'; return;
    }
    fechar();
    callback(delta, motivo);
  };
  inpDelta.focus();
}

/** Salva a edição de um campo de um lote (corrige valor digitado errado;
 * fica registrado com data/usuário — ver `editarLoteFioCru`). */
function salvarCampoFioCru(inp, linha, campo, valor) {
  inp.style.borderColor = '#CBD5E1';
  chamar('editarLoteFioCru', sessao.token, linha, campo, valor)
    .then(function () {
      // Qualquer edição pode mudar o saldo (o próprio ou de outro lote, se a
      // ordem por data mudar) e a auditoria — recarrega pra refletir certinho.
      carregarEstoqueFioCru();
    })
    .catch(function (err) {
      inp.style.borderColor = '#D0342C';
      tratarErro(err);
    });
}

/** Preenche o seletor de tipo de fio do lançamento de NF com os tipos que já
 * existem no estoque (mantém a opção "novo tipo") — o usuário escolhe um
 * existente em vez de redigitar, evitando duplicar o mesmo fio com grafias
 * diferentes. Preserva a escolha atual se ela ainda estiver na lista. */
function preencherSeletorTipoFioCru(tipos) {
  var sel = document.getElementById('fc-tipo');
  if (!sel) return;
  var atual = sel.value;
  var opcoes = ['<option value="">— escolha o tipo de fio —</option>'];
  (tipos || []).forEach(function (t) {
    opcoes.push('<option value="' + escAttr(t) + '">' + t + '</option>');
  });
  opcoes.push('<option value="__novo__">+ Novo tipo de fio…</option>');
  sel.innerHTML = opcoes.join('');
  // Preserva a seleção anterior (ex.: "__novo__" enquanto digita), se ainda válida.
  if (atual && Array.prototype.some.call(sel.options, function (o) { return o.value === atual; })) {
    sel.value = atual;
  }
}

function lancarNfFioCru() {
  var msg = document.getElementById('fc-msg');
  var sel = document.getElementById('fc-tipo');
  var tipoFio = sel.value === '__novo__'
    ? document.getElementById('fc-tipo-novo').value.trim()
    : sel.value;
  if (!tipoFio) {
    msg.innerHTML = '<div class="aviso erro">Escolha o tipo de fio (ou informe um novo).</div>';
    return;
  }
  var dados = {
    tipoFio: tipoFio,
    nf: document.getElementById('fc-nf').value,
    fornecedor: document.getElementById('fc-fornecedor').value,
    quantidade: document.getElementById('fc-qtd').value,
    precoUnitario: document.getElementById('fc-preco').value,
    data: document.getElementById('fc-data').value
  };
  var btn = document.getElementById('btn-lancar-nf');
  btn.disabled = true;
  msg.innerHTML = '<div class="aviso"><span class="carregando">Lançando…</span></div>';
  chamar('lancarNotaFioCru', sessao.token, dados)
    .then(function () {
      btn.disabled = false;
      msg.innerHTML = '<div class="aviso ok">NF lançada.</div>';
      ['fc-nf', 'fc-fornecedor', 'fc-qtd', 'fc-preco', 'fc-tipo-novo'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('fc-tipo-novo').style.display = 'none';
      sel.value = '';
      // Recarrega o estoque: o tipo novo (se houver) já entra no seletor.
      carregarEstoqueFioCru();
    })
    .catch(function (err) {
      btn.disabled = false;
      var m = tratarErro(err);
      if (m) msg.innerHTML = '<div class="aviso erro">' + m + '</div>';
    });
}
